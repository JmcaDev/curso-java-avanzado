<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CV-Form</title>
    <link rel="stylesheet" th:href="@{/css/form-style.css}">
</head>
<body>
    <h1>Nuestro CV</h1>
    <form th:object="${cvData}" method="post" th:action="@{/generate-cv}">
        <h2>Detalles Personales</h2>
        <div>
            <label for="firstName">Nombre:</label>
            <input type="text" id="firstName" th:field="*{personalDetails.firstName}"/>
        </div>

        <div>
            <label for="lastName">Apellido:</label>
            <input type="text" id="lastName" th:field="*{personalDetails.lastName}" />
        </div>

        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" th:field="*{personalDetails.email}"  />
        </div>

        <div>
            <label for="phone">Teléfono:</label>
            <input type="text" id="phone" th:field="*{personalDetails.phone}"  />
        </div>

        <div>
            <label for="address">Dirección:</label>
            <input type="text" id="address" th:field="*{personalDetails.address}"  />
        </div>

        <div>
            <label for="city">Ciudad:</label>
            <input type="text" id="city" th:field="*{personalDetails.city}"  />
        </div>

        <div>
            <label for="province">Provincia:</label>
            <input type="text" id="province" th:field="*{personalDetails.province}"  />
        </div>

        <div>
            <label for="postalCode">Código Postal:</label>
            <input type="text" id="postalCode" th:field="*{personalDetails.postalCode}"  />
        </div>

        <div>
            <label for="professionalProfile">Perfil Profesional:</label>
            <textarea id="professionalProfile" rows="5" th:field="*{personalDetails.professionalProfile}" ></textarea>
        </div>

        <hr/>

        <h2>Educación</h2>
        <div th:each="education, stat : *{educations}">
            <h3>Educación <span th:text="${stat.index + 1}"></span></h3>
            <div>
                <label th:for="${'education_institution_' + stat.index}">Institución:</label>
                <input type="text" th:field="*{educations[__${stat.index}__].institution}" th:id="${'education_institution_' + stat.index}" />
            </div>
            <div>
                <label th:for="${'education_title_' + stat.index}">Título:</label>
                <input type="text" th:field="*{educations[__${stat.index}__].degree}" th:id="${'education_title_' + stat.index}"/>
            </div>
            <div>
                <label th:for="${'education_period_' + stat.index}">Período:</label>
                <input type="text" th:field="*{educations[__${stat.index}__].period}" th:id="${'education_period_' + stat.index}"/>
            </div>
            <div>
                <label th:for="${'education_description_' + stat.index}">Descripción:</label>
                <textarea rows="3" th:field="*{educations[__${stat.index}__].description}" th:id="${'education_description_' + stat.index}"></textarea>
            </div>
            <hr th:if="${!stat.last}"/>
        </div>

        <hr/>

        <h2>Experiencia</h2>
        <div th:each="experience, stat : *{experiences}">
            <h3>Experiencia <span th:text="${stat.index + 1}"></span></h3>
            <div>
                <label th:for="${'experience_jobTitle_' + stat.index}">Nombre del cargo:</label>
                <input type="text" th:field="*{experiences[__${stat.index}__].jobTitle}" th:id="${'experience_jobTitle_' + stat.index}"/>
            </div>
            <div>
                <label th:for="${'experience_company_' + stat.index}">Empresa:</label>
                <input type="text" th:field="*{experiences[__${stat.index}__].company}" th:id="${'experience_company_' + stat.index}"/>
            </div>
            <div>
                <label th:for="${'experience_period_' + stat.index}">Período:</label>
                <input type="text" th:field="*{experiences[__${stat.index}__].period}" th:id="${'experience_period_' + stat.index}"/>
            </div>
            <div>
                <label th:for="${'experience_description_' + stat.index}">Descripción:</label>
                <textarea rows="3" th:field="*{experiences[__${stat.index}__].description}" th:id="${'experience_description_' + stat.index}"></textarea>
            </div>
            <hr th:if="${!stat.last}"/>
        </div>

        <hr/>

        <h2>Habilidades</h2>
        <div th:each="skill, stat : *{skills}">
            <h3>Habilidad <span th:text="${stat.index + 1}"></span></h3>
            <div>
                <label th:for="${'skill_name_' + stat.index}">Habilidad:</label>
                <input type="text" th:field="*{skills[__${stat.index}__].name}" th:id="${'skill_name_' + stat.index}"/>
            </div>
            <div>
                <label th:for="${'skill_level_' + stat.index}">Nivel:</label>
                <input type="text" th:field="*{skills[__${stat.index}__].level}" th:id="${'skill_level_' + stat.index}"/>
            </div>
            <hr th:if="${!stat.last}"/>
        </div>
        <br/>
        <button type="submit">Generar/Actualizar CV</button>
    </form>
</body>
</html>
